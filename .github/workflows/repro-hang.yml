name: Repro hang in simulator

# TEMPORARY diagnostic job. Boots a simulator twice — the device-matching iOS
# 16.1 runtime (device is 16.1.2; REPRO_PICK=device prefers 16.1.x) and the
# newest (26.x, control) — and for each: installs the app, seeds one server
# profile + token, serves canned API answers on 127.0.0.1:3080, drives
# Settings → Chat Channels → "+" editor → Message Settings through the
# CODEG_REPRO_* env hooks, then collects evidence (screenshots, `sample`,
# the app's own sampler / freeze archive, and the stub log). The hang is iOS
# 16 specific, so a content-interesting freeze on 16.1 with a clean 26.x
# control is the signature we are after (cold-start ~1.5s noise never counts).
#
# It deliberately does NOT publish a release (that is `build-unsigned-ipa.yml`,
# which runs on `ios16-compat`). This one only runs on `repro-sim` and by hand.

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Simulator runtime identifier to force for the iOS-16 run"
        required: false
        default: ""
      slug:
        description: "Settings leaf slug to push (CODEG_REPRO_LEAF)"
        required: false
        default: "chatchannels"
  push:
    branches:
      - repro-sim

permissions:
  contents: write

jobs:
  repro:
    name: Drive and sample
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC="/Applications/Xcode.app"; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Try to fetch an old iOS runtime
        continue-on-error: true
        run: |
          # Best effort: the device runs 16.1.2; grab 16.1 first so the
          # REPRO_PICK=device picker lands on the closest match.
          xcodebuild -downloadPlatform iOS -buildVersion 16.1 || true
          xcodebuild -downloadPlatform iOS -buildVersion 16.0 || true
          xcodebuild -downloadPlatform iOS || true
          xcrun simctl list runtimes

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee build.log | tail -80
          APP=$(find simbuild/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP"

      - name: Drive on the device-matching iOS 16 runtime (the repro run)
        if: env.APP != ''
        continue-on-error: true
        env:
          REPRO_LEAF: ${{ github.event.inputs.slug || 'chatchannels' }}
        run: |
          FORCED="${{ github.event.inputs.runtime }}"
          # device ⇒ prefer 16.1.x (the phone runs 16.1.2), else any 16.x.
          REPRO_PICK=device bash scripts/repro_run.sh "$APP" ios16 "$FORCED"

      - name: Drive on the newest iOS runtime (control run)
        if: env.APP != ''
        continue-on-error: true
        env:
          REPRO_LEAF: ${{ github.event.inputs.slug || 'chatchannels' }}
        run: |
          # No forced runtime here — the control always uses the newest
          # available, whatever the input said about the repro run.
          REPRO_PICK=newest bash scripts/repro_run.sh "$APP" ios26 ""

      - name: Publish logs to a branch
        if: always()
        run: |
          git config user.email "ci@codeg.local"
          git config user.name "ci"
          mkdir -p ci-artifacts
          cp -f build.log repro-*.png sample-*.txt mainsample-*.txt \
                freeze-*.txt simlog-*.txt verdict-*.txt stub-*.log \
                ci-artifacts/ 2>/dev/null || true
          xcrun simctl list runtimes > ci-artifacts/runtimes.txt 2>&1 || true
          # Keep the previous run's single-name copies from going stale.
          for sfx in ios16 ios26; do
            [ -f "repro-$sfx.png" ] && cp -f "repro-$sfx.png" ci-artifacts/repro-settings.png
          done
          ls -la ci-artifacts || true
          echo "----- verdicts -----"
          cat verdict-*.txt 2>/dev/null || true
          git add -f ci-artifacts
          git commit -q -m "ci: repro logs for run ${GITHUB_RUN_NUMBER}" || true
          git push -f origin "HEAD:ci-artifacts" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-evidence
          path: |
            repro-*.png
            sample-*.txt
            mainsample-*.txt
            freeze-*.txt
            simlog-*.txt
            verdict-*.txt
            stub-*.log
          retention-days: 14
          if-no-files-found: warn
