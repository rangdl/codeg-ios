# Unit tests for the pure-logic layer.
#
# Separate from `build-unsigned-ipa.yml` on purpose: that workflow publishes a
# release, and a red test should never block shipping a build someone needs to
# install. This one is the signal for "did the port break the logic".
name: Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test (defaults to the triggering ref)"
        required: false
        default: ""
  push:
    branches:
      - "ios16-v1.1-compat"

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i "Xcode" || true
          sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iOS simulator
        id: sim
        run: |
          # Any installed iOS runtime will do: the tests are pure logic.
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys
d=json.load(sys.stdin)["devices"]
for runtime, devices in sorted(d.items()):
    if "iOS" not in runtime: continue
    for dev in devices:
        if dev.get("isAvailable"):
            print(dev["name"]); raise SystemExit')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee test.log

      - name: Summarize failures
        if: failure()
        run: |
          echo "### Test failures" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|failed|Test Case .* failed" test.log \
            | sed -E 's/^.*(CodegiOS(Test)?s?\/[^:]+:[0-9]+)/\1/' \
            | sort -u | head -100 >> "$GITHUB_STEP_SUMMARY" || true
