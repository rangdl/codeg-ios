name: Symbolicate .ips reports

# A hang report (bug_type 509) carries a stackshot with image uuids but no image
# names, and the app's own frames can only be named with the *matching* build's
# binary. This job finds the release whose binary uuid matches the report, runs
# `atos` on the app's frames, and prints the symbolicated stack into the CI log —
# readable from anywhere, unlike a local symbolication.
#
# Triggered by pushing a report into `logs/`, or by pushing this file (so it can be
# run on demand). `workflow_dispatch` would be neater, but GitHub only offers that
# for workflows that exist on the default branch.
#
# The release build is `xcodebuild build` (Release, no install/strip step), so the
# binary inside the IPA still carries its symbol table.

on:
  push:
    branches:
      - ios16-compat
    paths:
      - 'logs/*.ips'
      - '.github/workflows/symbolicate.yml'

permissions:
  contents: read

jobs:
  symbolicate:
    name: Symbolicate the newest reports
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch candidate binaries from recent releases
        run: |
          set -o pipefail
          mkdir -p bins
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" \
            | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              for a in r.get('assets', []):
                  print(r['tag_name'], a['id'])
          " > assets.txt
          cat assets.txt
          while read -r tag id; do
            [ -z "$id" ] && continue
            echo "--- downloading $tag"
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id" \
              -o "bins/$tag.ipa" || continue
            mkdir -p "bins/$tag"
            unzip -o -q "bins/$tag.ipa" -d "bins/$tag" 2>/dev/null || true
            find "bins/$tag" -name Codeg -type f -exec cp {} "bins/$tag.bin" \; 2>/dev/null || true
            rm -f "bins/$tag.ipa"
          done < assets.txt
          ls -la bins/ | head -30

      - name: Symbolicate
        run: |
          # No `set -e` here: a non-matching binary, or a report with no app frames,
          # is a normal outcome and must not abort the sweep.
          set +e
          # Newest reports first; the ones from older builds simply won't match a
          # binary and will say so.
          ls -t logs/*.ips | head -2 > reports.txt
          echo "reports:"; cat reports.txt
          echo "binaries:"; ls bins/*.bin 2>/dev/null
          for report in $(cat reports.txt); do
            for bin in bins/*.bin; do
              [ -f "$bin" ] || continue
              echo "============================ $report  vs  $bin"
              python3 scripts/symbolicate_ips.py "$report" "$bin" > frames.txt 2>&1
              cat frames.txt
              grep '^ *atos ' frames.txt > atos.txt
              while read -r line; do
                [ -z "$line" ] && continue
                echo "----- $line"
                eval "$line"
              done < atos.txt
            done
          done
          echo "done"
