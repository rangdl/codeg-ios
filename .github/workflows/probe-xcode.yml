name: Probe Xcode

# Temporary workflow: reports the Xcode versions available on each macOS runner
# so we can pick a runner that ships the iOS 26 SDK (required to compile the
# `#available(iOS 26)` Liquid Glass branches). Safe to delete once the build
# workflow is pinned to a known-good runner.

on:
  workflow_dispatch:
  push:
    branches: [ios16-compat]

jobs:
  probe:
    name: Probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-14]
    steps:
      - name: Xcode inventory
        run: |
          echo "runner = ${{ matrix.os }}"
          echo "----- sw_vers -----"
          sw_vers || true
          echo "----- /Applications (Xcode*) -----"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
          echo "----- default xcodebuild -----"
          xcodebuild -version 2>&1 || true
          echo "----- xcode-select -p -----"
          xcode-select -p 2>&1 || true
